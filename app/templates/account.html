{% extends 'base.html' %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="container">
  <h2>Профіль користувача</h2>
  <p><strong>Username:</strong> {{ user.username }}</p>
  <p><strong>Email:</strong> {{ user.email }}</p>
  <p><a class="btn btn-secondary" href="{{ url_for('users.all_users') }}">Переглянути всіх користувачів</a></p>
</div>
{% endblock %}
